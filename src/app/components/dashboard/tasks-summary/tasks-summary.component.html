<!-- ESTRUTURA DEFINITIVA: manter. Trocar apenas o binding quando a API existir. -->
<div class="panel__head">
  <div class="panel__head-text">
    <h2 class="panel__title">
      <span class="panel__title-icon panel__title-icon--purple">
        <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
      </span>
      {{ title }}
    </h2>
    <p class="panel__subtitle">{{ subtitle }}</p>
  </div>

</div>

<ul class="summary-list">
  @for (item of items; track item.label) {
    <li class="summary-item">
      <span class="summary-item__dot summary-item__dot--{{ item.modifier }}" aria-hidden="true"></span>
      <span class="summary-item__label">{{ item.label }}</span>
      <span class="summary-item__count">{{ item.count }}</span>
      <div class="progress-track">
        <span class="progress-track__fill progress-track__fill--{{ item.modifier }}" [style]="'--progress: ' + item.progress"></span>
      </div>
      <span class="summary-item__pct">{{ item.percentLabel }}</span>
    </li>
  }
</ul>
