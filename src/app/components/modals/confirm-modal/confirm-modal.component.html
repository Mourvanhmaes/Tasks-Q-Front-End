<div class="modal-body app-modal__confirm">
  <div class="app-modal__confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h5>{{ title }}</h5>
  <p>{{ message }} <strong>{{ name }}</strong>. Isso nao pode ser desfeito.</p>
</div>
<div class="modal-footer justify-content-center">
  <button type="button" mdbRipple class="btn btn-secondary-ghost" (click)="modalRef.close()">Cancelar</button>
  <button type="button" mdbRipple class="btn btn-danger" (click)="modalRef.close(true)">{{ confirmText }}</button>
</div>
