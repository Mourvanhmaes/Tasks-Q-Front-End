<app-shell>
<div class="page">

  <app-page-header
    class="page-header"
    [title]="'Gerenciamento de Projetos'"
    [subtitle]="'Crie projetos, adicione tarefas e monte a equipe responsavel.'">
    <button type="button" mdbRipple class="btn btn-primary" (click)="openProjectModal()">
      <i class="fa-solid fa-plus me-2"></i>Novo Projeto
    </button>
  </app-page-header>

  <!-- ESTRUTURA DEFINITIVA: manter. Trocar apenas o binding quando a API existir. -->
  <div class="project-grid">
    @for (project of projects; track project.name) {
      <app-project-card
        class="project-card"
        [project]="project"
        (edit)="openProjectModal()"
        (team)="openAssignUsersModal()"></app-project-card>
    }
  </div>
</div>
</app-shell>
